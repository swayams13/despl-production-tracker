name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, demo]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: despl_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # DIRECT_URL: table owner, used by `prisma migrate deploy` and by
      # provision-db-role.sql. DATABASE_URL: the despl_web login role that
      # migration 20260813051500_rls_and_app_role's `despl_app` permission
      # bundle gets granted to below — same two-role split described in
      # scripts/provision-db-role.sql and .env.example, just with a
      # throwaway CI password instead of a real one.
      # connection_limit caps match .env.test's tuning — left uncapped,
      # Prisma's cpus*2+1 default blows past Postgres's max_connections (100)
      # once vitest's worker threads run DB-gated tests in parallel.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/despl_ci?connection_limit=3
      DATABASE_URL: postgresql://despl_web:ci_only_password@localhost:5432/despl_ci?connection_limit=10
      AUTH_SECRET: ci_only_secret_not_used_outside_github_actions_00000000
      # psql/libpq don't understand Prisma's connection_limit query param —
      # a plain-URL twin of DIRECT_URL for the two raw-psql steps below.
      PSQL_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/despl_ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      # Migration 20260815120000_v_unit_stage_status GRANTs directly to
      # despl_web mid-sequence, so the login role must exist before any
      # migration runs — provision-db-role.sql can't go first because it
      # grants despl_app, which a *later*-in-that-same-migration statement
      # creates. Bare role now; full grants + password + timezone once
      # migrate deploy has finished creating despl_app (below).
      - name: Pre-create despl_web login role
        run: |
          psql "$PSQL_DIRECT_URL" -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'despl_web') THEN
                CREATE ROLE despl_web LOGIN PASSWORD 'ci_only_password';
              END IF;
            END \$\$;"

      # Applies every migration against a throwaway database as the table
      # owner (DIRECT_URL) — the exact step that was missing from the
      # production deploy path and caused the 2026-08-24 outage. Runs here,
      # against every PR, before anything can reach main.
      - run: pnpm exec prisma migrate deploy

      - name: Provision despl_web role
        run: psql "$PSQL_DIRECT_URL" -v despl_web_password=ci_only_password -f scripts/provision-db-role.sql

      # DB-gated tests read fixtures (e.g. DESPL-320, its ProcessPlan rows)
      # that only exist after seeding + schedule bootstrap — same two steps
      # local dev runs before `pnpm test:db`. Order matters: db:seed must run
      # before any DB-gated test touches this database, since those tests
      # create throwaway Organization rows they never clean up (by design,
      # per .env.test) — run afterwards, `organization.findFirst()` in
      # scripts/bootstrap-schedule.ts could resolve to one of those instead
      # of the real seeded tenant.
      - run: pnpm db:seed
      - run: pnpm db:bootstrap

      # DESPL-320's Component/ComponentOperation, BomItem, and AssemblyStep
      # rows are deliberately NOT part of db:seed (see prisma/seed.ts's own
      # comment on why) — they're separate, idempotent scripts a local dev
      # runs once by hand and forgets about, since despl_test stays populated
      # between runs. CI's despl_ci database is thrown away every run, so
      # these three must run here too or any DB-gated test that expects a
      # seeded Component (e.g. welding.service.test.ts's fixture()) fails
      # with P2025 against an empty table. No ordering dependency between
      # the three — each only needs the Job/Equipment/Unit/
      # AssemblyTemplateVersion rows db:seed already created above.
      - run: pnpm db:seed:despl320-components
      - run: pnpm db:seed:despl320-bom
      - run: pnpm db:seed:despl320-assembly-steps

      - run: pnpm test
      - name: DB-gated tests
        run: pnpm exec vitest run
        env:
          RUN_DB_TESTS: "1"

      - run: pnpm build

      # e2e (S4). All 21 Playwright tests were local-only until now, including
      # e2e/auth.spec.ts's RBAC and client-scoping violation pins — so nothing
      # stopped a PR from breaking client scoping. They gate merges now.
      #
      # No server orchestration here on purpose: playwright.config.ts's
      # `webServer` block already runs `pnpm build && pnpm start` itself
      # (reuseExistingServer is false when CI is set), against the database
      # the steps above seeded. e2e/auth.setup.ts logs in through the real
      # /login form with the seeded SEED_PASSWORD default — never a forged
      # session (CLAUDE.md, Agent conduct). DATABASE_URL and AUTH_SECRET are
      # already set at job level, so no extra env is needed.
      #
      # The cache is worth its complexity: the browser download is ~45-90s
      # uncached versus ~10s on a hit, and it changes only when the
      # @playwright/test version does.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      # Traces and the HTML report are the only way to diagnose a failure that
      # does not reproduce locally; without this a red e2e run is a dead end.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
